# Builds the web version and publishes it to GitHub Pages
# (https://javipolo.github.io/pandive/) on every push to main.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history: the version comes from git describe

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0 # same SDK as local builds (material_ui fork)
          cache: true

      - run: flutter pub get

      # Base href = repository name (project page: /<repo>/).
      - run: make web WEB_BASE_HREF=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
